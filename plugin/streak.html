<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usage-Streak</title><style>:root {
	color-scheme: dark;
	--background: #151516;
	--foreground: #dee0e2;
	--accent: #4759c2;
	--muted: color-mix(in srgb, var(--foreground) 58%, var(--background));
	--line: color-mix(in srgb, var(--foreground) 12%, var(--background));
	--hover: color-mix(in srgb, var(--foreground) 7%, var(--background));
	--l0: color-mix(in srgb, var(--foreground) 7%, var(--background));
	--l1: color-mix(in srgb, var(--accent) 25%, var(--background));
	--l2: color-mix(in srgb, var(--accent) 50%, var(--background));
	--l3: color-mix(in srgb, var(--accent) 80%, var(--background));
	--l4: color-mix(in srgb, var(--accent) 75%, #b3b6f5);
}
* {
	box-sizing: border-box;
}
/* Use Genex's theme accent fill and selection text inside the isolated plugin frame. */
::selection {
	background: var(--selection-background, var(--accent));
	color: #ffffff;
}
body {
	margin: 0;
	background: var(--background);
	color: var(--foreground);
	font:
		13px "Zalando Sans SemiExpanded",
		"Geist Fallback",
		system-ui,
		sans-serif;
	line-height: 1.5;
}
button,
input,
select {
	font: inherit;
	color: inherit;
}
button {
	cursor: pointer;
}
button:focus-visible,
select:focus-visible,
summary:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 3px;
}
button {
	border: 0;
	background: transparent;
	border-radius: 7px;
}
button:not(.day):hover {
	background: var(--hover);
}
h1,
h2,
p {
	margin: 0;
}
h1 {
	font-size: 21px;
	letter-spacing: -0.5px;
	font-weight: 600;
}
h2 {
	font-size: 14px;
	font-weight: 600;
}
small,
.hint,
.muted {
	color: var(--muted);
}
small {
	font-size: 11px;
}
strong {
	font-weight: 600;
}
select {
	background: var(--background);
	border: 1px solid var(--line);
	border-radius: 7px;
	padding: 7px 10px;
	max-width: 100%;
}
select option {
	background: var(--background);
}
.dashboard {
	max-width: 1180px;
	margin: auto;
	padding: 28px 32px;
}
.compact {
	padding: 6px 10px;
	overflow: hidden;
}
.top {
	display: flex;
	justify-content: space-between;
	align-items: flex-start;
	gap: 12px;
	margin-bottom: 20px;
}
.top p {
	color: var(--muted);
	margin-top: 4px;
}
.head-actions {
	display: flex;
	gap: 5px;
	flex-wrap: wrap;
	justify-content: flex-end;
}
.quiet {
	padding: 6px 10px;
	border: 1px solid var(--line);
	font-size: 12px;
}
.title-button {
	font-size: 13px;
	letter-spacing: 0;
	font-weight: 600;
	text-align: left;
	padding: 0;
}
.title-button span {
	color: var(--muted);
	margin-left: 6px;
}
.summary {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	margin-bottom: 14px;
}
.summary > strong {
	font-variant-numeric: tabular-nums;
	font-size: 20px;
	letter-spacing: -0.4px;
}
.summary > strong span {
	font-size: 12px;
	font-weight: 400;
	color: var(--muted);
	letter-spacing: 0;
}
.streak {
	font-size: 12px;
	white-space: nowrap;
}
.calendar-scroll {
	overflow-x: auto;
	padding: 2px 2px 4px;
}
.calendar {
	display: grid;
	grid-template-columns: 28px 1fr;
	grid-template-rows: 20px 83px;
	min-width: 510px;
	gap: 4px;
}
.month-row {
	grid-column: 2;
	display: grid;
	grid-template-columns: repeat(53, minmax(0, 1fr));
	font-size: 10px;
	color: var(--muted);
}
.month-row span {
	white-space: nowrap;
}
.weekdays {
	display: flex;
	flex-direction: column;
	justify-content: space-evenly;
	font-size: 9px;
	color: var(--muted);
	padding: 6px 0;
}
.heatmap {
	display: grid;
	grid-auto-flow: column;
	grid-template-rows: repeat(7, minmax(0, 1fr));
	grid-template-columns: repeat(53, minmax(0, 1fr));
	gap: 3px;
	align-content: start;
}
.day {
	width: 100%;
	height: 100%;
	min-width: 0;
	border-radius: 2px;
	padding: 0;
	border: 1px solid color-mix(in srgb, var(--foreground) 4%, transparent);
}
.day[aria-pressed="true"] {
	outline: 1px solid var(--foreground);
	outline-offset: 1px;
}
.l0 {
	background: var(--l0);
}
.l1 {
	background: var(--l1);
}
.l2 {
	background: var(--l2);
}
.l3 {
	background: var(--l3);
}
.l4 {
	background: var(--l4);
}
.day:hover {
	filter: brightness(1.4);
}
.calendar-foot {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 8px;
	font-size: 10px;
	color: var(--muted);
	margin: 7px 0 14px;
	min-height: 18px;
}
.calendar-foot button {
	font-size: 10px;
	color: var(--foreground);
	padding: 0 6px;
}
.legend {
	display: flex;
	align-items: center;
	gap: 3px;
	white-space: nowrap;
}
.legend i {
	width: 9px;
	height: 9px;
	border-radius: 2px;
}
.filters {
	display: flex;
	gap: 14px;
	align-items: flex-end;
	margin-bottom: 20px;
}
.filters label {
	display: flex;
	flex-direction: column;
	gap: 4px;
	font-size: 11px;
	color: var(--muted);
	max-width: 38%;
}
.filters label select {
	color: var(--foreground);
	min-width: 150px;
}
.filter-end {
	margin-left: auto;
	font-size: 11px;
}
.metrics {
	display: grid;
	grid-template-columns: repeat(4, minmax(0, 1fr));
	border-block: 1px solid var(--line);
	padding: 18px 0;
	margin: 20px 0;
	gap: 16px;
}
.metrics > div {
	display: flex;
	flex-direction: column;
	gap: 5px;
}
.metrics span {
	color: var(--muted);
	font-size: 11px;
}
.metrics strong {
	font-size: 18px;
	font-variant-numeric: tabular-nums;
}
.section-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 16px;
	gap: 12px;
}
.section-head > span {
	color: var(--muted);
	font-size: 11px;
}
.trend {
	padding: 4px 0 22px;
}
.bars {
	display: flex;
	gap: 3px;
	height: 100px;
	border-bottom: 1px solid var(--line);
	align-items: flex-end;
}
.bars button {
	height: 100%;
	flex: 1;
	min-width: 0;
	border-radius: 0;
	display: flex;
	align-items: flex-end;
	padding: 0;
}
.bars i {
	display: block;
	width: 100%;
	height: var(--height);
	min-height: 1px;
	background: var(--accent);
	border-radius: 2px 2px 0 0;
}
.axis {
	display: flex;
	justify-content: space-between;
	font-size: 10px;
	color: var(--muted);
	margin-top: 6px;
}
.games {
	margin-top: 10px;
}
.game {
	display: flex;
	align-items: center;
	gap: 14px;
	width: 100%;
	text-align: left;
	border-radius: 0;
	padding: 12px 0;
	border-top: 1px solid var(--line);
}
.shot {
	width: 112px;
	aspect-ratio: 16 / 9;
	flex-shrink: 0;
	background: var(--hover);
	border: 1px solid var(--line);
	border-radius: 7px;
	overflow: hidden;
	display: flex;
	align-items: center;
	justify-content: center;
}
.shot > span {
	font-size: 9px;
	color: var(--muted);
}
.shot img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}
.game-copy {
	flex: 1;
	min-width: 0;
	display: flex;
	flex-direction: column;
	gap: 4px;
}
.game-copy strong {
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.game-tokens {
	text-align: right;
	font-variant-numeric: tabular-nums;
	font-size: 16px;
}
.game-tokens small {
	display: block;
	font-size: 10px;
}
.tabs {
	display: flex;
	gap: 22px;
	border-bottom: 1px solid var(--line);
	margin-top: 24px;
}
.tabs button {
	padding: 12px 0;
	border-radius: 0;
	color: var(--muted);
	border-bottom: 2px solid transparent;
}
.tabs button[aria-current="page"] {
	color: var(--foreground);
	border-bottom-color: var(--accent);
}
.hint {
	font-size: 11px;
	margin: 12px 0;
}
.event-tree details {
	border-bottom: 1px solid var(--line);
}
.event-tree summary {
	cursor: pointer;
	padding: 14px 0;
	display: flex;
	align-items: center;
	gap: 10px;
	list-style: none;
	font-size: 12px;
}
.event-tree summary span:not(.node) {
	color: var(--muted);
}
.event-tree summary small {
	margin-left: auto;
}
.node {
	width: 7px;
	height: 7px;
	border: 1px solid var(--accent);
	border-radius: 50%;
	flex-shrink: 0;
}
.event-tree ol {
	list-style: none;
	margin: 0 0 10px 3px;
	padding: 0 0 0 18px;
	border-left: 1px solid var(--line);
}
.event-tree li {
	display: grid;
	grid-template-columns: 64px 1fr;
	gap: 14px;
	padding: 10px 0;
	position: relative;
}
.event-tree li:before {
	content: "";
	position: absolute;
	left: -22px;
	top: 18px;
	width: 6px;
	height: 6px;
	background: var(--background);
	border: 1px solid var(--muted);
	border-radius: 50%;
}
.event-tree time {
	color: var(--muted);
	font-size: 10px;
	font-variant-numeric: tabular-nums;
}
.event-tree p {
	font-size: 12px;
	color: var(--muted);
	margin-top: 5px;
	white-space: pre-wrap;
	overflow-wrap: anywhere;
}
.status {
	font-size: 10px;
	color: var(--muted);
	margin-left: 6px;
}
.status[data-status="failed"] {
	color: #f08287;
}
.event-label {
	font-size: 12px;
}
.file,
.files {
	font-family: ui-monospace, monospace;
	font-size: 11px;
	overflow-wrap: anywhere;
}
.files {
	list-style: none;
	margin: 12px 0;
	padding: 0;
}
.files li {
	padding: 9px 0;
	border-bottom: 1px solid var(--line);
}
.model-table {
	margin-top: 12px;
	overflow-x: auto;
}
.model-row {
	display: grid;
	grid-template-columns: minmax(150px, 2fr) repeat(4, minmax(65px, 1fr));
	gap: 16px;
	min-width: 510px;
	width: 100%;
	text-align: right;
	padding: 13px 0;
	border-bottom: 1px solid var(--line);
	border-radius: 0;
	font-size: 12px;
}
.model-row > :first-child {
	text-align: left;
	overflow-wrap: anywhere;
}
.table-head {
	font-size: 10px;
	color: var(--muted);
}
.footer {
	display: flex;
	justify-content: space-between;
	gap: 12px;
	font-size: 10px;
	color: var(--muted);
	margin-top: 28px;
	padding-top: 14px;
	border-top: 1px solid var(--line);
}
.empty,
.loading {
	padding: 20px 0;
	color: var(--muted);
}
.loading {
	padding: 20px;
}
.loading p {
	margin: 12px 0;
}
.warning {
	font-size: 11px;
	color: #efbe72;
	margin: 8px 0;
	overflow-wrap: anywhere;
}
.compact .top {
	margin: 0 0 4px;
}
.compact .summary {
	margin-bottom: 6px;
}
.compact .summary > strong {
	font-size: 15px;
}
.compact .summary > strong span {
	font-size: 10px;
}
.compact .streak {
	font-size: 10px;
}
.compact .calendar {
	grid-template-rows: 16px 61px;
	min-width: 470px;
}
.compact .heatmap {
	gap: 2px;
}
.compact .calendar-foot {
	margin: 4px 0 6px;
	font-size: 9px;
}
.compact .game {
	padding: 7px 0;
	gap: 10px;
}
.compact .shot {
	width: 58px;
	border-radius: 5px;
}
.compact .game-copy strong {
	font-size: 11px;
}
.compact .game-copy small {
	font-size: 9px;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.compact .game-tokens {
	font-size: 12px;
}
.compact .game-tokens small {
	font-size: 9px;
}
.compact .warning {
	font-size: 9px;
}
.compact .streak .muted {
	display: none;
}
@media (max-width: 640px) {
	.dashboard {
		padding: 18px 16px;
	}
	.top {
		flex-wrap: wrap;
	}
	.metrics {
		grid-template-columns: repeat(2, minmax(0, 1fr));
	}
	.filters {
		gap: 8px;
		flex-wrap: wrap;
	}
	.filters label {
		max-width: 48%;
	}
	.filters label select {
		min-width: 110px;
		width: 100%;
	}
	.filter-end {
		margin-left: 0;
	}
	.summary {
		align-items: flex-start;
		flex-direction: column;
		gap: 3px;
	}
	.game-copy small {
		display: none;
	}
	.shot {
		width: 80px;
	}
	.footer {
		flex-direction: column;
	}
	.compact {
		padding: 4px 6px;
	}
	.compact .summary {
		flex-direction: row;
	}
	.compact .summary > strong span {
		display: none;
	}
	.streak {
		font-size: 10px;
	}
}
@media (prefers-reduced-motion: reduce) {
	* {
		scroll-behavior: auto !important;
		animation: none !important;
		transition: none !important;
	}
}

.calendar {
	--cell: 12px;
	grid-template-columns: 28px max-content;
	grid-template-rows: 20px calc(7 * var(--cell) + 18px);
	width: max-content;
	min-width: 0;
}
.heatmap {
	grid-template-rows: repeat(7, var(--cell));
	grid-template-columns: repeat(53, var(--cell));
}
.month-row {
	grid-template-columns: repeat(53, var(--cell));
	gap: 3px;
}

	--cell: 8px;
	min-width: 0;

}
.compact .month-row {
	gap: 2px;
}
.checkpoint-changes {

}
.verified li {
	display: grid;
	grid-template-columns: 1fr auto auto;

.added {
	color: #7cd194;
}
.removed {

/* The host provides a bounded 16px transparent overscan for the flame's subtle halo. */
.widget-page { overflow: hidden; background: transparent; }
.compact {
  --widget-muted: color-mix(in srgb, var(--foreground) 80%, var(--background));
  --aura: var(--widget-muted); --aura-secondary: var(--widget-muted);
  --l1: color-mix(in srgb, var(--accent) 25%, transparent);
  --l2: color-mix(in srgb, var(--accent) 50%, transparent);
  --l3: color-mix(in srgb, var(--accent) 80%, transparent);
  --l4: color-mix(in srgb, var(--accent) 76%, var(--foreground));
  display: grid; grid-template-columns: minmax(0,190px) 164px; justify-content:center; gap: 18px;
  width: 100%; height: 100vh; padding: 10px 16px; overflow: visible; position: relative; isolation: isolate;
  color: var(--foreground); font-family: "Zalando Sans SemiExpanded", system-ui, sans-serif;
}
/* The transparent panel reveals the host surface, shared with the prompt composer. */
/* A single vertical summary keeps the metrics beside the calendar, never spread across a spare column. */
.streak-overview { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; min-width:0; position:relative; }
.streak-eyebrow { color:var(--widget-muted); font-size:13px; font-weight:400; line-height:16px; }
.streak-count { display:flex; align-items:center; gap:7px; position:relative; margin-top:6px; min-height:32px; }
.streak-count strong { font-size:14px; line-height:18px; font-weight:400; white-space:nowrap; position:relative; }
.streak-count strong span { font-weight: 450; }
.streak-total, .streak-record { color: var(--widget-muted); font-size: 14px; line-height: 20px; font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; }
.streak-record { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; }
.streak-record svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.streak-flame { position: relative; display: grid; place-items: center; width: 24px; height: 30px; flex: none; color: var(--aura); isolation: isolate; }
.streak-flame svg { width: 24px; height: 30px; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; position: relative; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--aura) 45%, transparent)); }
.streak-flame::before, .streak-flame::after { content: ""; position: absolute; pointer-events: none; z-index: -1; border-radius: 50%; will-change: transform, opacity; animation: streak-breathe var(--aura-cycle,7.6s) cubic-bezier(.45,0,.55,1) infinite; animation-delay: var(--aura-delay,0s); }
.streak-flame::before { inset: var(--aura-extent,-27px -26px); background: radial-gradient(ellipse, color-mix(in srgb, var(--aura) var(--aura-energy,25%), transparent) 0%, color-mix(in srgb, var(--aura-secondary) 12%, transparent) 30%, transparent 70%); filter: blur(9px); }
.streak-flame::after { inset: var(--aura-core,-11px -10px); background: radial-gradient(ellipse, color-mix(in srgb, var(--aura-secondary) 38%, transparent), transparent 65%); filter: blur(5px); animation-name: streak-drift; animation-duration: var(--aura-echo,10.4s); }
.compact[data-aura="rest"] .streak-flame::before, .compact[data-aura="rest"] .streak-flame::after { opacity: 0; animation: none; }
.compact[data-aura="rest"] .streak-flame svg { filter: none; }
.compact[data-aura="ember"] { --aura: #e8bb85; --aura-secondary: #d49963; --aura-energy: 19%; --aura-extent: -21px -20px; --aura-cycle: 8.8s; }
.compact[data-aura="flame"] { --aura: #f3a677; --aura-secondary: #de795d; --aura-energy: 24%; --aura-core: -17px -8px; --aura-cycle: 7.6s; }
.compact[data-aura="coral"] { --aura: #f2a0ad; --aura-secondary: #ce7caa; --aura-energy: 26%; --aura-extent: -25px -29px; --aura-cycle: 8.4s; }
.compact[data-aura="violet"] { --aura: #c2adf5; --aura-secondary: #8e8ae3; --aura-energy: 28%; --aura-extent: -23px -34px; --aura-cycle: 10s; --aura-echo: 12.4s; }
.compact[data-aura="aurora"] { --aura: #a0c6f5; --aura-secondary: #8bdbce; --aura-energy: 30%; --aura-extent: -28px -36px; --aura-core: -12px -16px; --aura-cycle: 9.6s; --aura-echo: 13.2s; }
.compact[data-aura="solar"] { --aura: #f2dfb3; --aura-secondary: #dcb584; --aura-energy: 33%; --aura-extent: -30px -34px; --aura-core: -15px -13px; --aura-cycle: 8s; --aura-echo: 11.2s; }
.usage-total { display:flex; align-items:baseline; gap:7px; margin-top:3px; white-space:nowrap; }

.compact .day.month-start { border-top-color:color-mix(in srgb,var(--foreground) 50%,transparent); }

.widget-legend { display:flex; align-items:center; gap:3px; }
.widget-legend i { display:block; width:6px; height:7px; border-radius:1px; }
.widget-legend .l0 { background:color-mix(in srgb,var(--foreground) 6%,transparent); }
@keyframes streak-breathe { 0%,100% { transform: translate(-1px,2px) scale(.92); opacity: .5; } 50% { transform: translate(1px,-2px) scale(1.07); opacity: .9; } }
@keyframes streak-drift { 0%,100% { transform: translate(2px,1px) scale(.94,.98); opacity: .45; } 50% { transform: translate(-2px,-2px) scale(1.04,1.08); opacity: .8; } }
.motion-paused .streak-flame::before, .motion-paused .streak-flame::after { animation-play-state: paused; }
.widget-open-today { display:none; }
/* Preserve readable labels when the available width cannot accommodate the activity strip. */
@media (max-width:360px) {
 .compact { display:flex; align-items:center; justify-content:center; padding:8px 18px; }
 .streak-overview { width:100%; }
 .compact .widget-calendar { display:none; }
 .streak-eyebrow { font-size:12px; line-height:14px; }
 .usage-total { flex-wrap:wrap; column-gap:5px; row-gap:0; }
 .usage-total strong { font-size:24px; line-height:28px; }
 .usage-total > span { font-size:12px; line-height:14px; }
 .usage-period { line-height:14px; }
 .compact[data-empty="true"] .usage-total strong { font-size:22px; white-space:normal; line-height:25px; }
 .streak-count { gap:6px; margin-top:4px; min-height:28px; }
 .streak-count strong { font-size:14px; line-height:18px; }
 .streak-record { font-size:12px; line-height:14px; }
 .streak-flame,.streak-flame svg { width:18px; height:27px; }
 .streak-flame::before,.streak-flame::after { inset-block:-8px; }
 .widget-open-today { display:block; padding:0; margin-top:2px; font:inherit; font-size:12px; line-height:16px; border:0; border-radius:3px; background:transparent; color:var(--foreground); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
}
@media (prefers-reduced-motion: reduce) {
  .streak-flame::before, .streak-flame::after { animation: none; transform: none; opacity: .6; will-change: auto; }
}

 animation: streak-flame-outer 2s steps(1,end) infinite;
 animation-delay: var(--aura-delay,0s);
}

  }
  async function loadImages() {

        if (!meta || loaded.get(p.name) === meta.at) continue;
        loaded.set(p.name, meta.at);
